spring:
  datasource:
    url: jdbc:h2:mem:presales;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: false

logging:
  level:
    root: WARN
    com.presales.pipeline: INFO

app:
  security:
    username: test-admin
    password: test-password-2026
  operator:
    fixed-name: 测试操作人
  cors:
    allowed-origins: http://localhost:5173
